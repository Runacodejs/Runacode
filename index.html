<!DOCTYPE html>
<html>
<head>
    <title>Math Solver</title>
</head>
<body>
    <h1>Math Solver</h1>
    
    <h2>Solve by Text</h2>
    <form id="text-form">
        <input type="text" id="expression" placeholder="Enter math expression">
        <button type="submit">Solve</button>
    </form>
    
    <h2>Solve by Image</h2>
    <form id="image-form" enctype="multipart/form-data">
        <input type="file" id="image-file" name="image" accept="image/*">
        <button type="submit">Solve from Image</button>
    </form>
    
    <h2>Result</h2>
    <div id="result"></div>

    <script>
        document.getElementById('text-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const expression = document.getElementById('expression').value;
            const response = await fetch('/solve', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ expression })
            });
            const data = await response.json();
            document.getElementById('result').innerText = JSON.stringify(data);
        });

        document.getElementById('image-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('image', document.getElementById('image-file').files[0]);
            
            const response = await fetch('/upload', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            document.getElementById('result').innerText = JSON.stringify(data);
        });
    </script>
</body>
</html>
